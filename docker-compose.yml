services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hayane
      POSTGRES_USER: hayane
      POSTGRES_PASSWORD: hayane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayane -d hayane"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use Docker internal hostname (sslmode=disable: no SSL cert on local PG)
      DATABASE_URL: postgres://hayane:hayane@db:5432/hayane?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
