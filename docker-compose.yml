x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ports: bound to localhost only for local admin access
    #   - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql

  nginx:
    image: nginx:alpine
    logging: *default-logging
    restart: unless-stopped
    # Break alpine-nginx's /var/log/nginx/{access,error}.log → /dev/{stdout,stderr}
    # symlinks so fail2ban on the host can tail the named volume (nginx_logs).
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -f /var/log/nginx/access.log /var/log/nginx/error.log
        exec nginx -g 'daemon off;'
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      # cloudflared Tunnel ingress target (docs/ops/admin-access-cloudflare.md §3.3).
      # Only bound to loopback — admin vhost is NOT published to 0.0.0.0.
      - "127.0.0.1:8443:8443"
    networks:
      - frontend
      - admin-frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./nginx/scanner-blocklist.conf:/etc/nginx/conf.d/scanner-blocklist.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./admin-frontend/dist:/usr/share/nginx/html-admin:ro
      # Narrowed from full `/etc/letsencrypt` mount (was exposing ACME account keys).
      # symlinks in live/ resolve to archive/ — both must be mounted.
      - /etc/letsencrypt/live/www.and--line.com:/etc/letsencrypt/live/www.and--line.com:ro
      - /etc/letsencrypt/archive/www.and--line.com:/etc/letsencrypt/archive/www.and--line.com:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    healthcheck:
      # Loopback /healthz in nginx.conf (no redirect; busybox wget cannot disable redirect follow)
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin-api:
    logging: *default-logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.admin
      # Same as `api`: host network during build so `npm ci` matches registry/DNS behavior.
      network: host
    user: "appuser:appgroup"
    expose:
      - "3011"
    # admin-api is isolated on `admin-frontend` network so a compromise of the
    # public `api` (which shares `frontend` with nginx) cannot reach it over the
    # docker bridge. Both still reach `db` via `backend`.
    networks:
      - admin-frontend
      - backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      ADMIN_FRONTEND_ORIGIN: ${ADMIN_FRONTEND_ORIGIN:-https://admin.and--line.com}
      # Optional: set both to enable Cf-Access-Jwt-Assertion verification (production behind Cloudflare Access).
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
      PORT: "3011"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(3011,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  api:
    logging: *default-logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    user: "appuser:appgroup"
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_PLAN_ROLE_IDS: ${DISCORD_PLAN_ROLE_IDS}
      PAYJP_SECRET_KEY: ${PAYJP_SECRET_KEY}
      PAYJP_WEBHOOK_TOKEN: ${PAYJP_WEBHOOK_TOKEN}
      PAYJP_LIVEMODE: ${PAYJP_LIVEMODE}
      PAYJP_PLAN_IDS: ${PAYJP_PLAN_IDS}
      PAYJP_PLAN_INITIAL_CHARGE_AMOUNTS: ${PAYJP_PLAN_INITIAL_CHARGE_AMOUNTS}
      DAILY_RESYNC_CRON: ${DAILY_RESYNC_CRON}
      SUBSCRIBE_GATE_CODE: ${SUBSCRIBE_GATE_CODE:-}
      ACCESS_GATE_SESSION_TTL_SECONDS: ${ACCESS_GATE_SESSION_TTL_SECONDS:-86400}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      GOOGLE_FORM_CANCEL_BASE_URL: ${GOOGLE_FORM_CANCEL_BASE_URL}
      GOOGLE_FORM_CANCEL_EMAIL_ENTRY_ID: ${GOOGLE_FORM_CANCEL_EMAIL_ENTRY_ID}
      GOOGLE_FORM_CANCEL_TOKEN_ENTRY_ID: ${GOOGLE_FORM_CANCEL_TOKEN_ENTRY_ID}
      GOOGLE_FORM_CANCEL_SECRET: ${GOOGLE_FORM_CANCEL_SECRET}
      GOOGLE_FORM_CANCEL_TOKEN_SECRET: ${GOOGLE_FORM_CANCEL_TOKEN_SECRET}
      GOOGLE_FORM_CANCEL_TOKEN_TTL_SECONDS: ${GOOGLE_FORM_CANCEL_TOKEN_TTL_SECONDS}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  nginx_logs:

networks:
  # Public front-plane: nginx ↔ api (www.and--line.com / api.and--line.com).
  frontend:
  # Admin front-plane: nginx ↔ admin-api only (admin.and--line.com via 127.0.0.1:8443).
  # Isolated from `frontend` so a compromise of `api` cannot reach admin-api
  # over the docker bridge.
  admin-frontend:
  # Back-plane: api/admin-api ↔ db only. Isolates db from external-facing nginx.
  backend:
