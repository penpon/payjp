services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hayane
      POSTGRES_USER: hayane
      POSTGRES_PASSWORD: hayane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayane -d hayane"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://hayane:hayane@db:5432/hayane?sslmode=disable
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_PAID_ROLE_ID: ${DISCORD_PAID_ROLE_ID}
      PAYJP_SECRET_KEY: ${PAYJP_SECRET_KEY}
      PAYJP_WEBHOOK_TOKEN: ${PAYJP_WEBHOOK_TOKEN}
      PAYJP_LIVEMODE: ${PAYJP_LIVEMODE}
      PAYJP_PLAN_IDS: ${PAYJP_PLAN_IDS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
