<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>購読管理 — PAY.JP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #533afd;
      --color-primary-hover: #4434d4;
      --color-heading: #061b31;
      --color-body: #64748d;
      --color-label: #273951;
      --color-bg: #ffffff;
      --color-border: #e5edf5;
      --color-success: #15be53;
      --color-success-bg: rgba(21, 190, 83, 0.2);
      --color-success-text: #108c3d;
      --color-error: #ea2261;
      --color-error-bg: rgba(234, 34, 97, 0.08);
      --color-error-border: rgba(234, 34, 97, 0.2);
      --color-discord-blurple: #5865F2;
      --color-discord-blurple-hover: #4752C4;
      --color-discord-green: #57F287;
      --color-discord-red: #ED4245;
      --color-discord-dark: #2C2F33;
      --color-discord-not-quite-black: #23272A;
      --color-purple-light: #b9b9f9;
      --color-border-soft-purple: #d6d9fc;
      --shadow-elevated: rgba(50,50,93,0.25) 0px 30px 45px -30px, rgba(0,0,0,0.1) 0px 18px 36px -18px;
      --shadow-button: rgba(50,50,93,0.25) 0px 6px 12px -2px, rgba(0,0,0,0.1) 0px 3px 7px -3px;
      --shadow-modal: rgba(50,50,93,0.25) 0px 50px 100px -20px, rgba(0,0,0,0.3) 0px 30px 60px -30px;
      --font-sans: Inter, 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-body);
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      width: 100%;
      max-width: 720px;
    }

    /* --- Card --- */

    .card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 32px 24px;
      box-shadow:
        rgba(50, 50, 93, 0.25) 0px 30px 45px -30px,
        rgba(0, 0, 0, 0.1) 0px 18px 36px -18px;
    }

    .heading {
      font-size: 20px;
      font-weight: 500;
      color: var(--color-heading);
      letter-spacing: -0.2px;
      margin-bottom: 12px;
    }

    .body-text {
      font-size: 16px;
      font-weight: 300;
      color: var(--color-body);
      margin-bottom: 20px;
    }

    .body-text-sub {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-body);
    }

    /* --- Discord button --- */

    .discord-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--color-discord-blurple);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 400;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow:
        rgba(50, 50, 93, 0.25) 0px 6px 12px -2px,
        rgba(0, 0, 0, 0.1) 0px 3px 7px -3px;
      transition: background-color 150ms ease-out;
    }

    .discord-button:hover { background: var(--color-discord-blurple-hover); }
    .discord-button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .discord-button:active { transform: scale(0.98); }

    /* --- Badge --- */

    .badge {
      border-radius: 4px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 20px;
    }

    .success-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--color-success-bg);
      border: 1px solid rgba(21, 190, 83, 0.4);
      color: var(--color-success-text);
    }

    .success-icon { color: var(--color-success); font-weight: 500; }

    .error-badge {
      background: rgba(237, 66, 69, 0.2);
      border: 1px solid var(--color-discord-red);
      color: var(--color-discord-red);
    }

    .plan-placeholder {
      border-top: 1px solid var(--color-border);
      padding-top: 20px;
      margin-top: 4px;
    }

    .plan-placeholder .body-text { margin-bottom: 0; }

    /* --- Loading --- */

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 0;
    }

    .loading-container .body-text { margin-bottom: 0; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-discord-blurple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Plan grid --- */

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .plan-card {
      background: var(--color-bg);
      border: 2px solid var(--color-border);
      border-radius: 6px;
      padding: 20px 16px;
      cursor: pointer;
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }

    .plan-card:hover {
      border-color: var(--color-primary);
    }

    .plan-card--selected {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(83, 58, 253, 0.1);
    }

    .plan-card:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .plan-card-name {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      font-weight: 300;
      color: var(--color-heading);
      margin-bottom: 4px;
    }

    .plan-card-price {
      font-family: Inter, sans-serif;
      font-size: 32px;
      font-weight: 300;
      color: var(--color-heading);
      letter-spacing: -0.64px;
      line-height: 1.2;
      font-feature-settings: "tnum";
    }

    .plan-card-interval {
      font-size: 14px;
      color: var(--color-body);
      margin-bottom: 12px;
    }

    .plan-card-features {
      list-style: none;
      font-size: 13px;
      color: var(--color-body);
    }

    .plan-card-features li {
      padding: 2px 0;
    }

    .plan-card-features li::before {
      content: '\2713';
      color: var(--color-success);
      margin-right: 6px;
      font-size: 12px;
    }

    /* --- Form --- */

    .billing-card {
      max-width: 720px;
    }

    .form-section {
      margin-bottom: 24px;
    }

    .form-section-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-heading);
      margin-bottom: 16px;
      padding-top: 8px;
      border-top: 1px solid var(--color-border);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 400;
      color: var(--color-label);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 10px 12px;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 400;
      color: var(--color-heading);
      background: var(--color-bg);
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }

    .form-input::placeholder { color: var(--color-body); }
    .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(83, 58, 253, 0.1);
    }

    .form-input--error {
      border-color: var(--color-error);
      box-shadow: 0 0 0 3px rgba(234, 34, 97, 0.1);
    }

    /* --- PAY.JP card element --- */

    .payjp-mount {
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 12px;
      min-height: 44px;
      transition: border-color 150ms ease-out;
    }

    .payjp-mount:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(83, 58, 253, 0.1);
    }

    .card-error {
      font-size: 13px;
      font-weight: 400;
      color: var(--color-error);
      margin-top: 4px;
    }

    /* --- Consent --- */

    .consent-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .consent-checkbox {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }

    .consent-checkbox:checked {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .consent-checkbox:checked::after {
      content: '\2713';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .consent-checkbox:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .consent-label {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-label);
      cursor: pointer;
    }

    .consent-link {
      color: var(--color-primary);
      text-decoration: underline;
    }

    /* --- Buttons --- */

    .submit-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--color-primary);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 400;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow:
        rgba(50, 50, 93, 0.25) 0px 6px 12px -2px,
        rgba(0, 0, 0, 0.1) 0px 3px 7px -3px;
      transition: background-color 150ms ease-out;
    }

    .submit-button:hover { background: var(--color-primary-hover); }
    .submit-button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .submit-button:disabled { opacity: 0.5; cursor: not-allowed; }
    .submit-button:disabled:hover { background: var(--color-primary); }

    .start-billing-button { width: auto; }

    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: transparent;
      color: var(--color-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      padding: 10px 20px;
      border: 1px solid var(--color-purple-light);
      border-radius: 4px;
      cursor: pointer;
      margin-top: 16px;
      transition: border-color 150ms ease-out, background-color 150ms ease-out;
    }

    .secondary-button:hover { border-color: var(--color-primary); background: rgba(83, 58, 253, 0.05); }

    /* --- Error / Warning banners --- */

    .error-banner {
      background: var(--color-error-bg);
      border: 1px solid var(--color-error-border);
      color: var(--color-error);
      font-size: 14px;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .warning-banner {
      background: rgba(155, 104, 41, 0.08);
      border: 1px solid rgba(155, 104, 41, 0.2);
      color: #9b6829;
      font-size: 14px;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    /* --- Operation ID box --- */

    .operation-id-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f6f9fc;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .operation-id-value {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--color-heading);
      word-break: break-all;
      flex: 1;
    }

    .copy-button {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--color-body);
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 150ms ease-out;
    }

    .copy-button:hover {
      border-color: var(--color-body);
    }

    /* --- Success --- */

    .success-container {
      text-align: center;
      margin-bottom: 24px;
    }

    .success-icon-large {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--color-success-bg);
      color: var(--color-success);
      font-size: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .success-heading {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 26px;
      font-weight: 300;
      color: var(--color-heading);
      letter-spacing: -0.26px;
    }

    .result-details {
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .result-row + .result-row {
      border-top: 1px solid var(--color-border);
    }

    .result-label {
      font-size: 14px;
      color: var(--color-body);
    }

    .result-value {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-heading);
    }

    .status-badge {
      display: inline-block;
      background: var(--color-success-bg);
      color: var(--color-success-text);
      font-size: 13px;
      font-weight: 400;
      padding: 2px 10px;
      border-radius: 4px;
    }

    /* --- Subscribed state --- */

    .subscribed-status {
      text-align: center;
      padding: 16px 0;
    }

    .subscribed-plan-name {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 22px;
      font-weight: 300;
      color: var(--color-heading);
      letter-spacing: -0.22px;
      margin: 8px 0;
    }

    .subscribed-detail {
      font-size: 14px;
      color: var(--color-body);
      text-align: center;
      margin-top: 12px;
    }

    /* --- Cancel button --- */

    .cancel-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #ea2261;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      padding: 10px 20px;
      border: 1px solid rgba(234, 34, 97, 0.3);
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 150ms ease-out;
    }

    .cancel-button:hover { background: rgba(234, 34, 97, 0.05); }
    .cancel-button:focus-visible { outline: 2px solid #ea2261; outline-offset: 2px; }
    .cancel-button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* --- Cancel section --- */

    .cancel-separator {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 24px 0;
    }

    .cancel-section-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-heading);
      margin-bottom: 8px;
    }

    .cancel-section-desc {
      font-size: 14px;
      color: var(--color-body);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    /* --- Modal overlay --- */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    .modal {
      background: #ffffff;
      border-radius: 8px;
      box-shadow:
        rgba(50, 50, 93, 0.25) 0px 50px 100px -20px,
        rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
    }

    .modal-title {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--color-heading);
      letter-spacing: -0.2px;
      margin-bottom: 12px;
    }

    .modal-body {
      font-size: 14px;
      color: var(--color-body);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* --- Ghost Neutral button --- */

    .ghost-neutral-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: transparent;
      color: var(--color-body);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      padding: 10px 20px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 150ms ease-out;
    }

    .ghost-neutral-button:hover { border-color: var(--color-body); }
    .ghost-neutral-button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    /* --- Cancel complete icon --- */

    .cancel-complete-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(83, 58, 253, 0.1);
      color: #533afd;
      font-size: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    /* --- Cancel info card --- */

    .cancel-info-card {
      background: rgba(83, 58, 253, 0.04);
      border: 1px solid #d6d9fc;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    /* --- Financial data: tabular numerals --- */

    .result-value,
    .operation-id-value {
      font-feature-settings: "tnum";
    }

    /* --- Responsive --- */

    @media (max-width: 768px) and (min-width: 641px) {
      .plan-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .plan-grid {
        grid-template-columns: 1fr;
      }

      .plan-card-price {
        font-size: 26px;
      }

      #app {
        max-width: 480px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
        border-color: var(--color-discord-blurple);
      }
      .discord-button,
      .submit-button,
      .secondary-button,
      .ghost-neutral-button,
      .cancel-button,
      .plan-card,
      .form-input,
      .copy-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://js.pay.jp/v2/pay.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
