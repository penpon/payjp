# payjp-ops thresholds — single source of truth. Shell-sourced.
# Tuning: expect 2-week tuning window after Go-Live; commit threshold diffs to git.

# ---- Disk ----
DISK_PCT=85

# ---- Load ----
LOAD5_X_NPROC=2
LOAD5_CONSECUTIVE_TICKS=3

# ---- Swap ----
SWAP_PCT=50

# ---- fail2ban ----
FAIL2BAN_BANNED_THRESHOLD=10
FAIL2BAN_JAILS="sshd nginx-444 nginx-limit-req"

# ---- TLS ----
TLS_DAYS_CRITICAL=14
CERT_PATHS="/etc/letsencrypt/live/www.and--line.com/fullchain.pem"

# ---- Nginx (Phase B) ----
NGINX_5XX_PER_5MIN=5
NGINX_429_PER_5MIN=50
NGINX_UPSTREAM_P95_SEC=5.0

# ---- App + DB (Phase C) ----
APP_HEALTH_TIMEOUT=3
APP_HEALTH_SLOW_SEC=3.0
APP_PAYJP_EVENTS_FAILED_PER_1H=3
APP_IMPACT_LOGS_OPEN=5
APP_INFLIGHT_WARN_MIN=30
APP_INFLIGHT_CRIT_HOUR=6
DB_BACKUP_STALE_HOURS=26
BACKUP_DIR="/var/backups/payjp-db"

# ---- Cooldown (seconds) ----
COOLDOWN_CRITICAL=600       # 10 min
COOLDOWN_WARN=1800          # 30 min
COOLDOWN_NORMAL=3600        # 60 min
# Per-code overrides:
COOLDOWN_HOST_REBOOT_REQUIRED=86400
COOLDOWN_HOST_TLS_EXPIRING=86400

# ---- Resolution ----
GREEN_STREAK_FOR_RESOLVE=2

# ---- Global safety rails ----
GLOBAL_MIN_INTERVAL_SEC=60
STORM_CODES_THRESHOLD=5
