# payjp-ops アラートコード日本語翻訳表 — notify.sh が source する。
#
# 各コードに対し:
#   ALERT_JA_TITLE[CODE]   = 短い日本語タイトル (Discord embed title 用)
#   ALERT_JA_CONTEXT[CODE] = 状況説明 1-2 行 (何が起きたか・なぜ問題か)
#
# 未登録コードは notify.sh 側で fallback (元の英語 TITLE + (CODE))。
# 新アラート追加時は本ファイルに 2 行足せば自動的に日本語化される。
# RESOLVED 通知はコード末尾の _RESOLVED を剥がして base code を lookup する。

declare -gA ALERT_JA_TITLE
declare -gA ALERT_JA_CONTEXT

# ---- Linux host ----
ALERT_JA_TITLE[HOST_DISK_ROOT]="ルートディスク逼迫"
ALERT_JA_CONTEXT[HOST_DISK_ROOT]="ルート(/) の使用率が閾値を超過。放置すると書き込み不能で DB/nginx が停止する。"

ALERT_JA_TITLE[HOST_DISK_VARLOG]="/var/log 逼迫"
ALERT_JA_CONTEXT[HOST_DISK_VARLOG]="ログディレクトリの使用率が閾値超過。json-file 保持設定の見直し候補。"

ALERT_JA_TITLE[HOST_DISK_BACKUPS]="バックアップ領域逼迫"
ALERT_JA_CONTEXT[HOST_DISK_BACKUPS]="DB ダンプ保存先の使用率が閾値超過。retention 超過分の掃除必要。"

ALERT_JA_TITLE[HOST_LOAD_HIGH]="ロード高止まり"
ALERT_JA_CONTEXT[HOST_LOAD_HIGH]="load5 が nproc の閾値倍を 3 tick 連続超過。暴走プロセス疑い。"

ALERT_JA_TITLE[HOST_OOM_KILL]="OOM Killer 発動"
ALERT_JA_CONTEXT[HOST_OOM_KILL]="直近24hでカーネルがプロセスを強制終了。メモリ枯渇・limit 設定見直し。"

ALERT_JA_TITLE[HOST_REBOOT_REQUIRED]="再起動必要"
ALERT_JA_CONTEXT[HOST_REBOOT_REQUIRED]="kernel / libc 更新後の再起動未適用。計画再起動を実施。"

ALERT_JA_TITLE[HOST_SWAP_HIGH]="Swap 使用率高"
ALERT_JA_CONTEXT[HOST_SWAP_HIGH]="メモリ不足で Swap を消費中。APP/DB 応答遅延の前兆。"

ALERT_JA_TITLE[HOST_FAIL2BAN_SURGE]="fail2ban BAN 急増"
ALERT_JA_CONTEXT[HOST_FAIL2BAN_SURGE]="現在 BAN 中の IP 総数が閾値超過。攻撃検知または誤検知。"

ALERT_JA_TITLE[HOST_TLS_EXPIRING]="TLS 証明書期限切れ迫る"
ALERT_JA_CONTEXT[HOST_TLS_EXPIRING]="certbot 自動更新失敗の疑い。手動で certbot renew 実行必要。"

ALERT_JA_TITLE[HOST_DOMAIN_EXPIRING]="ドメイン期限切れ迫る"
ALERT_JA_CONTEXT[HOST_DOMAIN_EXPIRING]="Cloudflare Registrar 自動更新(-30d)失敗シグナル。支払い方法確認。"

# ---- Docker ----
ALERT_JA_TITLE[DOCKER_DAEMON_DOWN]="Docker デーモン停止"
ALERT_JA_CONTEXT[DOCKER_DAEMON_DOWN]="systemctl is-active docker が active でない。全サービス停止中。"

ALERT_JA_TITLE[DOCKER_CONTAINER_EXITED]="コンテナ停止"
ALERT_JA_CONTEXT[DOCKER_CONTAINER_EXITED]="compose 管理のコンテナが exited 状態。該当サービスログ確認必要。"

ALERT_JA_TITLE[DOCKER_RESTART_DELTA]="コンテナ再起動検知"
ALERT_JA_CONTEXT[DOCKER_RESTART_DELTA]="前 tick から RestartCount が増加。OOM や crash ループ疑い。"

ALERT_JA_TITLE[DOCKER_HEALTH_UNHEALTHY]="DB ヘルスチェック失敗"
ALERT_JA_CONTEXT[DOCKER_HEALTH_UNHEALTHY]="payjp-db-1 の healthcheck が unhealthy。APP 側 DB ping も停止予兆。"

# ---- Nginx ----
ALERT_JA_TITLE[NGINX_5XX_BURST]="5xx バースト"
ALERT_JA_CONTEXT[NGINX_5XX_BURST]="直近5分の 5xx 応答が閾値超過。APP 側エラー急増。"

ALERT_JA_TITLE[NGINX_429_BURST]="429 バースト"
ALERT_JA_CONTEXT[NGINX_429_BURST]="rate-limit 発動中。攻撃または bot の可能性。"

ALERT_JA_TITLE[NGINX_UPSTREAM_SLOW]="upstream 応答遅延"
ALERT_JA_CONTEXT[NGINX_UPSTREAM_SLOW]="直近200サンプルの p95 応答時間が閾値超過。DB 負荷を疑う。"

ALERT_JA_TITLE[NGINX_ERRLOG_CRIT]="nginx エラーログ重大"
ALERT_JA_CONTEXT[NGINX_ERRLOG_CRIT]="error.log に [crit|alert|emerg] の新規エントリ。設定ミス・接続障害疑い。"

# ---- Web app + DB ----
ALERT_JA_TITLE[APP_HEALTH_FAIL]="APP /health 失敗"
ALERT_JA_CONTEXT[APP_HEALTH_FAIL]="api コンテナの /health が非200またはタイムアウト。ユーザー影響あり。"

ALERT_JA_TITLE[APP_HEALTH_SLOW]="APP /health 遅延"
ALERT_JA_CONTEXT[APP_HEALTH_SLOW]="/health 応答時間が閾値超過。CPU/DB 負荷確認。"

ALERT_JA_TITLE[DB_PING]="DB 疎通失敗"
ALERT_JA_CONTEXT[DB_PING]="SELECT 1 失敗。DB コンテナ状態または接続プール枯渇。"

ALERT_JA_TITLE[APP_PAYJP_EVENTS_FAILED]="PAY.JP webhook 処理失敗"
ALERT_JA_CONTEXT[APP_PAYJP_EVENTS_FAILED]="直近1hで payjp_events.processing_result='failed' が閾値超過。ロール同期に影響。"

ALERT_JA_TITLE[APP_IMPACT_LOGS_OPEN]="未解決影響ログ増加"
ALERT_JA_CONTEXT[APP_IMPACT_LOGS_OPEN]="member_impact_logs.resolved_at IS NULL が閾値超過。resync CLI 対応必要。"

ALERT_JA_TITLE[APP_INFLIGHT_STUCK_WARN]="処理中フラグ滞留(警告)"
ALERT_JA_CONTEXT[APP_INFLIGHT_STUCK_WARN]="inflight_operation_started_at が閾値分超過。6h で critical へ昇格。"

ALERT_JA_TITLE[APP_INFLIGHT_STUCK_CRIT]="処理中フラグ滞留(致命)"
ALERT_JA_CONTEXT[APP_INFLIGHT_STUCK_CRIT]="inflight_operation が6h以上滞留。resync CLI で operation-id 指定復旧必須。"

ALERT_JA_TITLE[DB_BACKUP_STALE]="DB バックアップ古い"
ALERT_JA_CONTEXT[DB_BACKUP_STALE]="直近の pg_dump 成果物の age が閾値超過。nightly backup 不発疑い。"

ALERT_JA_TITLE[DB_OFFSITE_STALE]="オフサイトバックアップ古い"
ALERT_JA_CONTEXT[DB_OFFSITE_STALE]="B2 へのオフサイトアップロードの age が閾値超過。ランサム耐性喪失リスク。"

ALERT_JA_TITLE[DB_RESTORE_DRILL_STALE]="リストア訓練未実施"
ALERT_JA_CONTEXT[DB_RESTORE_DRILL_STALE]="月次 restore drill 最終成功から閾値日数超過。暗号化バックアップの可復旧性未検証。"

# ---- Aggregate ----
ALERT_JA_TITLE[OPS_STORM]="アラート嵐"
ALERT_JA_CONTEXT[OPS_STORM]="同一tick内で複数コードが同時発火。VPS 全体異常または上流障害の可能性。"
