add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "payment=(), geolocation=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.pay.jp; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.pay.jp; frame-src https://js.pay.jp; img-src 'self' data:" always;
