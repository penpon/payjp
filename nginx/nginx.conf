events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  gzip on;
  gzip_types text/css application/javascript application/json;
  gzip_min_length 256;

  upstream api { server api:3000; }

  # HTTP → HTTPS リダイレクト
  server {
    listen 80;
    server_name www.and--line.com api.and--line.com;
    return 301 https://$host$request_uri;
  }

  # フロントエンド（静的配信）+ 同一オリジン API プロキシ
  server {
    listen 443 ssl;
    server_name www.and--line.com;

    ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # Same-origin API proxy — required for __Host- cookies
    location /v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite ハッシュ付きアセット — immutable キャッシュ
    location /assets/ {
      include /etc/nginx/conf.d/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA フォールバック — 全パスを index.html へ
    location / {
      include /etc/nginx/conf.d/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }

  # バックエンド API
  server {
    listen 443 ssl;
    server_name api.and--line.com;

    ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
