worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # --- SSL/TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Compression (application/json excluded for BREACH mitigation) ---
    gzip on;
    gzip_types text/css application/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # --- Connection-level protections ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 65s;
    client_max_body_size 16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook:5m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # --- JSON structured logging ---
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$request_id",'
        '"host":"$host",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    upstream api { server api:3000; }
    upstream admin_api { server admin-api:3011; }

    # ===========================================
    # Default server: reject unknown Host / direct IP access
    # ===========================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;
        # Slow down repeated exploit probes (same IP) on catch-all; pair with return 444
        limit_req zone=general burst=20 nodelay;
        return 444;
    }

    # ===========================================
    # HTTP -> HTTPS redirect
    # ===========================================
    server {
        listen 80;
        server_name www.and--line.com api.and--line.com admin.and--line.com;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ===========================================
    # Frontend (static) + same-origin API proxy
    # ===========================================
    server {
        listen 443 ssl;
        server_name www.and--line.com;

        ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;

        root /usr/share/nginx/html;

        # Automated exploit probes (this stack does not use CGI)
        location ^~ /cgi-bin/ {
            return 444;
        }

        # Block dotfiles (except .well-known for ACME challenges)
        location ~ /\.(?!well-known) {
            return 404;
        }

        # Same-origin API proxy (required for __Host- cookies)
        location /v1/ {
            limit_except GET HEAD POST OPTIONS {
                deny all;
            }

            limit_req zone=general burst=20 nodelay;

            include /etc/nginx/conf.d/security-headers.conf;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 24k;

            proxy_hide_header X-Powered-By;
        }

        # Vite hashed assets (immutable cache)
        location /assets/ {
            limit_except GET HEAD {
                deny all;
            }
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # SPA fallback
        location / {
            limit_except GET HEAD {
                deny all;
            }
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }

    # ===========================================
    # Backend API (api.and--line.com)
    # ===========================================
    server {
        listen 443 ssl;
        server_name api.and--line.com;

        ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;

        # PAY.JP Webhook
        location = /v1/payjp/webhook {
            limit_except POST {
                deny all;
            }

            limit_req zone=webhook burst=50 nodelay;

            include /etc/nginx/conf.d/security-headers.conf;

            client_max_body_size 64k;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 24k;

            proxy_hide_header X-Powered-By;
        }

        # Health check
        location = /health {
            limit_except GET {
                deny all;
            }
            include /etc/nginx/conf.d/security-headers.conf;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Reject everything else
        location / {
            return 444;
        }
    }

    # ===========================================
    # Admin console (read-only) — admin.and--line.com
    # ===========================================
    server {
        listen 443 ssl;
        server_name admin.and--line.com;

        ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;

        root /usr/share/nginx/html-admin;

        location ^~ /admin/ {
            limit_except GET HEAD OPTIONS {
                deny all;
            }

            limit_req zone=general burst=20 nodelay;

            include /etc/nginx/conf.d/security-headers.conf;

            proxy_pass http://admin_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 24k;

            proxy_hide_header X-Powered-By;
        }

        location /assets/ {
            limit_except GET HEAD {
                deny all;
            }
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
