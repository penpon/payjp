events {}

http {
  upstream frontend { server frontend:5173; }
  upstream api      { server api:3000; }

  # HTTP → HTTPS リダイレクト
  server {
    listen 80;
    server_name www.and--line.com api.and--line.com;
    return 301 https://$host$request_uri;
  }

  # フロントエンド
  server {
    listen 443 ssl;
    server_name www.and--line.com;

    ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Same-origin API proxy — required for __Host- cookies
    location /v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # バックエンド API
  server {
    listen 443 ssl;
    server_name api.and--line.com;

    ssl_certificate     /etc/letsencrypt/live/www.and--line.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.and--line.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
