# ============================================================
# Scanner probe blocklist — return 444 (close connection)
# Include inside a server { } block BEFORE the SPA `location /` fallback.
# Regex locations are evaluated in the order they appear; first match wins.
# ============================================================

# Sensitive file extensions (backup / config / keys / logs / archives)
location ~* \.(env|bak|backup|old|save|orig|swp|swo|swn|sql|conf|ini|pem|key|yaml|yml|properties|tpl|dist|inc|cfg|log|gitconfig|pyc|tar|gz|tgz|zip)(\.[^.]+)?$ {

    return 444;
}

# Script extensions not used by this stack (static SPA + Node upstream)
location ~* \.(php|phtml|php3|php4|php5|phps|pl|cgi|asp|aspx|jsp|rb|py|sh|bash|jhtml|action|do)(\.[^.]+)?$ {

    return 444;
}

# WordPress / legacy CMS / admin-panel probes
location ~* ^/(wp-[a-z]|wordpress/|xmlrpc|phpmyadmin|pma/|myadmin|horde|squirrelmail|typo3/|drupal/|joomla/|magento/|phpinfo|info\.php|test\.php) {

    return 444;
}

# Framework / debug endpoints (Spring Actuator, Symfony profiler, Laravel Horizon, etc.)
location ~* ^/(actuator(/|$)|_profiler(/|$)|horizon(/|$)|manage/env|server-(info|status)|debug/(default|log)|app_dev\.php) {

    return 444;
}

# Secret/config basename probes (any path depth)
location ~* /(stripe|secrets?|credentials?|appsettings|docker-compose|serverless|swagger|parameters|application|database|aws-secret|settings|webhooks?|auth|tokens?)\.(json|xml|ts|py|rb|js|env|txt|html?)$ {

    return 444;
}

# Root-level JS / JSON are suspicious (this stack serves JS/JSON only under /assets/*)
location ~* ^/[^/]+\.(js|mjs|cjs|json|map)$ {

    return 444;
}

# Bare sensitive basenames at root (no extension): /env, /config, /phpinfo, etc.
location ~* ^/(env|envs|config|configs|phpinfo|info|test|setup|install|adminer)$ {

    return 444;
}
