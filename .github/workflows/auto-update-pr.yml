name: Auto Update PR Branches

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update open PR branches
        uses: adRise/update-pr-branch@v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          sort: created
          direction: asc
