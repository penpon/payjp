name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hayane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Biome lint & format
        run: npx biome check .
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p packages/shared/tsconfig.json && npx tsc --noEmit -p packages/auth-service/tsconfig.json && npx tsc --noEmit -p packages/billing-service/tsconfig.json && npx tsc --noEmit -p packages/sync-service/tsconfig.json && npx tsc --noEmit -p packages/server/tsconfig.json && npx tsc --noEmit -p frontend/tsconfig.json
      - name: Frontend build
        run: npm run build:frontend
        env:
          VITE_PAYJP_PUBLIC_KEY: pk_test_placeholder
      - name: Payment page security checks
        run: npm run check:payment-security
      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hayane_test
