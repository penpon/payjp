name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hayane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome lint & format
        run: npx biome check .
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p packages/shared/tsconfig.json && npx tsc --noEmit -p packages/auth-service/tsconfig.json && npx tsc --noEmit -p packages/billing-service/tsconfig.json && npx tsc --noEmit -p packages/sync-service/tsconfig.json && npx tsc --noEmit -p packages/server/tsconfig.json
      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hayane_test
